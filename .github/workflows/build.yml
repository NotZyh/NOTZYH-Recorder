name: Build NOTZYH Low-Lag Recorder

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download FFmpeg (BtbN win64 GPL build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg\ffmpeg.exe
          .\ffmpeg\ffmpeg.exe -version
          $enc = .\ffmpeg\ffmpeg.exe -hide_banner -encoders | Out-String
          if ($enc -notmatch "h264_qsv") { throw "FFmpeg build lacks h264_qsv" }
          if ($enc -notmatch "libx264")  { throw "FFmpeg build lacks libx264" }
          if ($enc -notmatch "aac")      { throw "FFmpeg build lacks aac" }

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name NOTZYH_LowLag_Recorder `
            --add-binary "ffmpeg\ffmpeg.exe;." `
            --hidden-import pyaudiowpatch `
            --collect-binaries pyaudiowpatch `
            --exclude-module tkinter `
            --exclude-module numpy `
            main.py

      - name: Self-test the EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\NOTZYH_LowLag_Recorder.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }
          Write-Host "Self-test passed."

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NOTZYH_LowLag_Recorder
          path: dist/NOTZYH_LowLag_Recorder.exe
          if-no-files-found: error
